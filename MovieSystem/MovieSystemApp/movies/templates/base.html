{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <title>{% block title %}Movie System{% endblock title %}</title>

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-pink shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'movie_list' %}">
                <i class="fa-solid fa-film"></i> Movie System
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'movie_list' %}">All Movies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'movie_add' %}">Add Movie</a>
                    </li>
                </ul>


        <form class="d-flex w-50" method="get" action="{% url 'movie_list' %}">
            <input
                id="navbar-movie-search"
                class="form-control me-2 flex-grow-1"
                type="search"
                name="q"
                value="{{ request.GET.q }}"
                placeholder="Search name, genre, director"
                data-search-url="{% url 'movie_search' %}"
            >

            <button class="btn btn-light flex-shrink-0" type="submit">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
            </div>
        </div>
    </nav>

    <div class="center-column">
        <!--success messages-->
        {% for message in messages %}
            <div class="alert alert-pink alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}

        {% block content %}
        {% endblock content %}
    </div>

    <!--footer-->
    
    <footer class="center-column footer-pink mt-4">
        <div class="text-center p-3">

            <p style="color: black;">&copy; {% now "Y" %} Lucy Cronin | R00244083</p>
            <a href="https://www.mtu.ie/">
                <img src="{% static 'images/MTU_Logo.png' %}" class="img-fluid" style="max-width: 400px;" alt="MTU Logo">
            </a>
        </div>
    </footer>



<!--live search functionality-->

<script>
document.addEventListener('DOMContentLoaded', function () {

    const searchInput = document.getElementById('navbar-movie-search');

    if (!searchInput) return;

    let timeout;

    searchInput.addEventListener('input', function () {

        clearTimeout(timeout);

        timeout = setTimeout(function () {

            const query = searchInput.value;

            const url = searchInput.dataset.searchUrl +
                '?q=' + encodeURIComponent(query);

            fetch(url)
                .then(response => response.json())
                .then(data => {

                    const resultsBody = document.getElementById('movie-results');

                    // Only update the table if it exists on the current page
                    if (!resultsBody) return;

                    resultsBody.replaceChildren();

                    if (data.movies.length === 0) {
                        const row = document.createElement('tr');
                        const cell = document.createElement('td');

                        cell.colSpan = 5;
                        cell.className = 'text-center';
                        cell.textContent = 'No movies found.';

                        row.appendChild(cell);
                        resultsBody.appendChild(row);
                        return;
                    }

                    data.movies.forEach(movie => {

                        const row = document.createElement('tr');

                        const nameCell = document.createElement('td');
                        const link = document.createElement('a');
                        link.href = movie.detail_url;
                        link.textContent = movie.name;
                        nameCell.appendChild(link);

                        const genreCell = document.createElement('td');
                        genreCell.textContent = movie.genre;

                        const directorCell = document.createElement('td');
                        directorCell.textContent = movie.director;

                        const dateCell = document.createElement('td');
                        dateCell.textContent = movie.release_date;

                        const posterCell = document.createElement('td');

                        if (movie.poster_url) {
                            const image = document.createElement('img');
                            image.src = movie.poster_url;
                            image.alt = movie.name + ' poster';
                            image.style.width = '80px';
                            image.style.height = '110px';
                            image.style.objectFit = 'cover';
                            posterCell.appendChild(image);
                        } else {
                            posterCell.textContent = 'No poster';
                        }

                    // Put the poster beside the movie name
                    if (movie.poster_url) {
                        const image = document.createElement('img');
                        image.src = movie.poster_url;
                        image.alt = movie.name + ' poster';
                        image.style.width = '80px';
                        image.style.height = '110px';
                        image.style.objectFit = 'cover';
                        image.style.borderRadius = '5px';
                        image.style.marginRight = '10px';

                        nameCell.prepend(image);
                    }

                    row.append(
                        nameCell,
                        genreCell,
                        directorCell,
                        dateCell
                    );

                        resultsBody.appendChild(row);
                    });

                })
                .catch(error => console.error('Search error:', error));

        }, 300);

    });

});
</script>

</body>
</html>
