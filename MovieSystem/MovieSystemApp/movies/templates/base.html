{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <title>{% block title %}Movie System{% endblock title %}</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-pink shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'movie_list' %}">
                <i class="fa-solid fa-film"></i> Movie System
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'movie_list' %}">All Movies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'movie_add' %}">Add Movie</a>
                    </li>
                </ul>
                <form class="d-flex w-50" method="get" action="{% url 'movie_list' %}">
                    <input class="form-control me-2 flex-grow-1" type="search" name="q"
                           value="{{ request.GET.q }}" placeholder="Search name, genre, director">
                    <button class="btn btn-light flex-shrink-0" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <div class="center-column">
        <!--success messages-->
        {% for message in messages %}
            <div class="alert alert-pink alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}

        {% block content %}
        {% endblock content %}
    </div>

    <footer class="center-column footer-pink mt-4">
        <div class="text-center p-3">

            <p style="color: black;">&copy; {% now "Y" %} Lucy Cronin | R00244083</p>
            <a href="https://www.mtu.ie/">
                <img src="{% static 'images/MTU_Logo.png' %}" class="img-fluid" style="max-width: 400px;" alt="MTU Logo">
            </a>
        </div>
    </footer>

</body>
</html>
